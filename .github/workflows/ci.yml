name: CI
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Postgres local + migrations + testes de RLS
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql >/dev/null
          sudo chmod -R a+rx "$GITHUB_WORKSPACE"
          sudo -u postgres env PGBIN=$(ls -d /usr/lib/postgresql/*/bin | tail -1) bash scripts/test-db.sh
